<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{% block title %} {% endblock %}</title>

  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	
  <!-- DataTable Bootstrapt CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dataTables.bootstrap5.min.css') }}">
  
  <!-- DataTable Bootstrapt Script -->
	<script defer src="{{ url_for('static', filename='js/dataTables.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/dataTables.bootstrap5.min.js')}}"></script>
  <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
  
  <!-- Chart Script -->
  <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
  
  <script defer src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</head>

<body>
  {% block layout %}

  {% endblock %}
</body>
</html>
