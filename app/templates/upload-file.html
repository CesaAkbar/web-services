{% extends "index.html" %}

{% block title %} Upload - Data Service {% endblock %}

{% block layout %}
<h1>File Upload</h1>
<form action = "/upload-file" method = "post" enctype="multipart/form-data">  
    <input type="file" name="file" accept=".png, .jpg, .jpeg, image/jpeg">
    <input type = "submit" value="Upload">  
</form>  
{% endblock %}
