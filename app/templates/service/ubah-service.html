{% extends "layout.html" %}

{% block title %} Ubah Service - Data Service {% endblock %}
{% block title_content %} Ubah Service {% endblock %}

{% block content %}

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('data_services')}}">Data Service</a></li>
        <li class="breadcrumb-item active" aria-current="page">Ubah Service</li>
    </ol>
</nav>
<form action="{{ url_for('ubah_services', id=data.id)}}" method="POST" class="row">
    <div class="col-6">
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Nama Customer: <i style="color: red;">*</i></label>
                <input class="form-control" disabled value="{{ data.nama }}" />
            </div>
            <div class="col">
                <label class="form-label">Nama Teknisi: </label>
                <select class="form-control" name="teknisi_id">
                    {% for list in teknisi %}
                        <option value="{{list.id}}" {% if data.teknisi_id == list.id %} selected {% endif %}>{{list.nama}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <hr>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Tgl Kunjungan: <i style="color: red;">*</i></label>
                <input class="form-control" type="date" required name="tanggal_kunjungan" value="{{ data.tanggal_kunjungan }}" />
            </div>
            <div class="col">
                <label class="form-label">Tgl Selesai: <i style="color: red;">*</i></label>
                <input class="form-control" type="date" required name="tanggal_selesai" value="{{ data.tanggal_selesai }}" />
            </div>
        </div>
        <hr>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Remark Unit: <i style="color: red;">*</i></label>
                <input class="form-control" name="remark_unit" value="{{data.remark_unit}}"/>
            </div>
            <div class="col">
                <label class="form-label">Status Pekerjaan: <i style="color: red;">*</i></label>
                <select class="form-control" name="status_pekerjaan">
                    <option value="in progress" {% if data.status_pekerjaan == 'in progress' %} selected {% endif %}>
                        In progress
                    </option>
                    <option value="completed" {% if data.status_pekerjaan == 'completed' %} selected {% endif %}>
                        Completed
                    </option>
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Keterangan Service: <i style="color: red;">*</i></label>
            <input class="form-control" name="keterangan_service" value="{{data.keterangan_service}}"/>
        </div>
        <div class="d-flex gap-1 justify-content-end">
            <a href="{{ url_for('data_services') }}" class="btn btn-danger btn-block">Cancel</a>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </div>
    </div>
</form>
{% endblock %}
