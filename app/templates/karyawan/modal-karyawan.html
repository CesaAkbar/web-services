<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  	<div class="modal-dialog">
    	<div class="modal-content">
      		<div class="modal-header">
        		<h5 class="modal-title" id="modalLabel">Tambah Karyawan</h5>
        		<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      		</div>
      		<div class="modal-body">
      	  		<form action="{{ url_for('tambah_karyawan') }}" method="POST">
      	    		<div class="row">
      	      			<div class="col mb-3">
							<label for="namaInput" class="mb-1">Nama:</label>
      	        			<input class="form-control" name="nama" id="namaInput" required placeholder="Nama Karayawan" />
      	      			</div>
      	      			<div class="col mb-3">
							<label for="telpInput" class="mb-1">Nomor Telepon:</label>
      	        			<input class="form-control" name="no_tlpn" id="telpInput" required placeholder="No. Telepon" />
      	      			</div>
      	    		</div>
      	    		<button type="submit" class="btn btn-primary">Simpan</button>
      	  		</form>
      		</div>
    	</div>
  	</div>
</div>
