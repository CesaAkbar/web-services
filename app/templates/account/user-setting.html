{% extends "layout.html" %}

{% block title %} Setting - Data Service {% endblock %}
{% block title_content %} Setting {% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
        <li class="breadcrumb-item active" aria-current="page">Setting</li>
    </ol>
</nav>
<form class="row">
    <h5 class="mb-3">Ganti Password</h5>
    <div class="col-6">
        <div class="mb-3">
            <label for="passwordInput" class="form-label">Password saat ini <i style="color: red;">*</i></label>
            <input type="password" class="form-control" id="passwordInput" name="password" required />
        </div>
        <hr>
        <div class="mb-3">
            <label for="newPasswordInput" class="form-label">Password baru <i style="color: red;">*</i></label>
            <input type="password" class="form-control" id="newPasswordInput" name="new_password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit</button>
    </div>
</form>
{% endblock %}
