{% extends "layout.html" %}

{% block title %} Ubah Karyawan - Data Service {% endblock %}
{% block title_content %} Ubah Karyawan {% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('data_karyawan')}}">Data Karayawan</a></li>
        <li class="breadcrumb-item active" aria-current="page">Ubah Karayawan</li>
    </ol>
</nav>
<form action="{{ url_for('ubah_karyawan', id=data.id) }}" method="POST" class="row">
    <div class="col-6">
        <div class="mb-3">
            <label class="form-label">Nama <i style="color: red;">*</i></label>
            <input class="form-control" required name=nama value="{{ data.nama }}" />
        </div>
        <div class="mb-3">
            <label class="form-label">No. Telepon <i style="color: red;">*</i></label>
            <input class="form-control" required name="no_tlpn" value="{{ data.no_tlpn }}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Upload Image</label>
            <input class="form-control" type="file" id="formFile">
        </div>
        <div class="d-flex gap-1 justify-content-end">
            <a href="{{ url_for('data_karyawan') }}" class="btn btn-danger btn-block">Cancel</a>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
        </div>
    </div>
</form>
{% endblock %}
