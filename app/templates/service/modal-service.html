<div class="modal fade" id="modalService" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">Tambah Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form action="{{ url_for('ubah_services', data=data.id)}}" method="POST">
            <div class="row mb-1">
                <div class="col">
                    <label for="customerInput" class="mb-1">Customer id: </label>
                    <input class="form-control" name="customer_id" id="customerInput" required placeholder="Customer" />
                </div>
                <div class="col">
                    <label for="teknisiInput" class="mb-1">Teknisi id: </label>
                    <input class="form-control" name="teknisi_id" id="teknisiInput" required placeholder="Teknisi" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="namaInput" class="mb-1">Tanggal Kunjungan: </label>
                    <input class="form-control" type="date" name="tanggal_kunjungan" id="namaInput" required/>
                </div>
                <div class="col">
                    <label for="telpInput" class="mb-1">Tanggal Selesai: </label>
                    <input class="form-control" type="date" name="tanggal_selesai" id="telpInput" required/>
                </div>
            </div>
            <hr>
            <div class="mb-3">
                <label for="remarkInput" class="mb-1">Remark Unit: </label>
                <input class="form-control" name="remark_unit" id="remarkInput" required placeholder="Remark Unit" />
            </div>
            <button type="submit" class="btn btn-primary">Simpan</button>
        </form>
      </div>
    </div>
  </div>
</div>
